sonar.projectKey=prj-trainee-skill-test-admin-web
sonar.organization=multi-drive

# This is the name and version displayed in the SonarCloud UI.
# sonar.projectName=prj-trainee-skill-test-admin-web
# sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

sonar.javascript.lcov.reportPaths=./__tests__/coverage/lcov.info
sonar.sources=./src,./tests
sonar.tests=./__tests__

# Include specific file types
sonar.inclusions=src/**/*.js,src/**/*.jsx,src/**/*.ts,src/**/*.tsx,tests/**/*.js,tests/**/*.jsx,tests/**/*.ts,tests/**/*.tsx

# Coverage configuration
sonar.coverage.exclusions=__tests__/**/*,**/*.test.js,**/*.spec.js,**/*.test.ts,**/*.spec.ts,**/schemas.ts

# Exclude test files from coverage analysis
sonar.exclusions=__tests__/**/*