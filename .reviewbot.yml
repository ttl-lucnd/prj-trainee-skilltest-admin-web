# Reviewbot config for a Next.js (App Router or Pages) repo.
#
# Usage: copy to repository ROOT as:
#   .reviewbot.yml | .reviewbot.yaml | .reviewbot.json
#
# Merges over bot defaults. Ruff applies only if Python files change in the PR.

enabled: true

review:
  auto_review: true
  skip_if_draft: true
  require_manual_trigger: true
  trigger_phrases:
    - /reviewbot
    - /review-bot

ignore:
  - "**/node_modules/**"
  - "**/.next/**"
  - "**/out/**"
  - "**/dist/**"
  - "**/.turbo/**"
  - "**/coverage/**"
  - "**/.vercel/**"
  - "**/*.min.js"
  - "**/*.min.css"
  - "**/pnpm-lock.yaml"
  - "**/package-lock.json"
  - "**/yarn.lock"
  # Regenerated by Next — drops noisy findings on generated types
  - "**/next-env.d.ts"

ai:
  instructions: |
    This repository uses Next.js (TypeScript/JavaScript).

    Boundaries:
    - Respect Server vs Client Components: files under `app/` default to Server Components unless marked `'use client'`. Flag accidental use of browser-only APIs or hooks in server components, or leaking secrets into client bundles via improper imports.
    - For `next/image` / remote `src`: treat user-controlled URLs as a trust-boundary issue — mention allowlists (`images.remotePatterns` / legacy `domains`) or validation; do not label client-side image URLs as SSRF unless server-side fetch of untrusted URLs appears in the diff.
    - Route Handlers (`route.ts`), Server Actions, and `middleware.ts`: watch auth checks, unsafe redirects, and dynamic path segments.
    - Data fetching: note incorrect `fetch` caching assumptions (`cache`, `revalidate`, `no-store`) only when the diff shows a concrete bug or contract mismatch.

    React hooks: prefer provable issues (effect cleanup, stale timers keyed by changing IDs). Avoid useCallback/useMemo nits unless referential stability clearly matters.

    Suggest tests only for regressions or edge cases clearly grounded in the changed code.

scanners:
  parallel_with_llm: true
  semgrep:
    enabled: true
    configs: p/typescript,p/javascript
    # If semgrep is installed on the worker:
    # enabled: true
    # configs: p/javascript
    max_findings: 80
